<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>白急線の方向幕</title>
<style>
:root{--h:min(120px,calc((100vw - 56px)/6.8));--paper:#FFFDEF}
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
.train{width:100%;padding:calc(var(--h)*1.4) 0 calc(var(--h)*1.1) calc(var(--h)*.5);position:relative;overflow:hidden;
  background:#D2EF8F}
.frame{display:inline-flex;gap:calc(var(--h)*.14);padding:calc(var(--h)*.1);border-radius:calc(var(--h)*.14);
  background:linear-gradient(#dff5aa,#b4cf76);
  box-shadow:0 0 0 2px #7f9448,0 3px 8px rgba(0,0,0,.5),inset 0 1px 1px rgba(255,255,255,.35);position:relative;z-index:1}
.win{height:var(--h);background:#1a1a1a;border-radius:calc(var(--h)*.06);overflow:hidden;position:relative;
  box-shadow:inset 0 0 0 2px #6f8340,inset 0 3px 8px rgba(0,0,0,.8)}
.win.t{width:calc(var(--h)*2)}
.win.d{width:calc(var(--h)*4)}
.win::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(rgba(255,255,255,.12) 0,rgba(255,255,255,0) 50%)}
.film{width:100%;will-change:transform}
.film img,.film .blank{display:block;width:100%;height:var(--h);background:#1a1a1a;object-fit:fill}
.panel{padding:20px 3vw 40px 5vw;display:flex;justify-content:space-between;align-items:flex-start;gap:3vw}
.panel .left{min-width:0}
.table{width:clamp(120px,24vw,230px);height:auto;flex:none;border-radius:2px}
.row{display:flex;flex-wrap:wrap;gap:18px 26px;margin-bottom:22px}
label{font-size:clamp(18px,3.4vw,26px);display:flex;align-items:center;gap:10px}
select,input{font-size:clamp(16px,3vw,24px);padding:2px 6px;max-width:100%}
input{width:7.5em}
button{font-size:clamp(18px,3.4vw,26px);padding:4px 14px;margin-right:14px;cursor:pointer;background:#efefef;border:2px solid #767676;border-radius:3px}
button:disabled{opacity:.5;cursor:default}
button:focus-visible{outline:3px solid #fff}
@media(max-width:560px){.panel{flex-wrap:wrap}.table{margin-left:auto;width:min(230px,60vw)}}
small{display:block;margin-top:24px;color:#999;font-size:13px}
input{width:7.5em}
.setting{display:flex;flex-wrap:nowrap;gap:16px clamp(12px,3vw,26px);margin-bottom:20px}
.grp{display:flex;flex-direction:column;align-items:center}
.grp h3{margin:0 0 6px;font-size:clamp(12px,2.6vw,15px);font-weight:400;letter-spacing:.3em}
.wheels{display:inline-grid;grid-template-columns:repeat(3,clamp(26px,8vw,42px));gap:4px;
  padding:6px 8px;background:#2a2d30;border-radius:6px;box-shadow:inset 0 0 0 2px #4a4f55}
.wheels button{margin:0;padding:0;height:clamp(14px,3.4vw,18px);border-radius:3px;background:#3a3d41;border:1px solid #5a5f65;box-shadow:0 2px 0 #15171a}
.wheels button:active{transform:translateY(2px);box-shadow:none}
.wheels .dg{height:clamp(34px,8vw,48px);display:flex;align-items:center;justify-content:center;
  background:linear-gradient(#050505,#1c1c1c 50%,#050505);color:#fff;border-radius:3px;
  font:700 clamp(22px,5.5vw,32px)/1 "Courier New",ui-monospace,monospace;box-shadow:inset 0 0 0 1px #3a3a3a;outline-offset:2px}
.nm{margin-top:6px;min-height:1.4em;font-size:clamp(11px,2.4vw,14px);color:#FFFDEF;text-align:center;max-width:16em}
#msg{color:#ff9a9a;font-size:15px;margin:-10px 0 14px;min-height:1.2em}
</style>
</head>
<body>
<div class="train"><div class="frame">
  <div class="win t"><div class="film" id="ft"></div></div>
  <div class="win d"><div class="film" id="fd"></div></div>
</div></div>
<div class="panel">
<div class="left">
  <div class="setting">
    <div class="grp"><h3>種別幕</h3>
      <div class="wheels" id="wt"></div></div>
    <div class="grp"><h3>行先幕</h3>
      <div class="wheels" id="wd"></div></div>
  </div>
  <div id="msg"></div>
  <button id="go">起動</button><button id="save">保存</button>
</div>

             d:{el:document.getElementById("fd"),row:1,imgs:DATA.D,blanks:BD}};
for(const k in films){
  const f=films[k];f.el.style.height=(N*100)+"%";
  for(let i=1;i<=N;i++){
    let n;
    if(f.imgs[i]){n=new Image();n.src=f.imgs[i];n.alt="";}else{n=document.createElement("div");n.className="blank";n.style.background="#FFFDEF";}
    f.el.appendChild(n);
  }
  f.el.style.transform=tf(f.row);
}
function tf(row){return `translateY(${-(row-1)/N*100}%)`}
const clampPos=p=>Math.max(1,Math.min(N,p));
const SEC_PER_ROW=3;
function plan(from,to){
  if(from===to)return [];
  const dir=to>from?1:-1;
  const p=[];
  // 最初の巻き戻し: 進行方向と逆に1コマ戻ってから進む(上へ行く時は一つ下がってから上へ)
  const back=dir<0?clampPos(from+1):from;
  if(back!==from)p.push([back,SEC_PER_ROW]);
  p.push([to,Math.abs(to-back)*SEC_PER_ROW]);
  return p;
}
const ease=t=>t;
function run(f,to){
  return new Promise(res=>{
    const segs=plan(f.row,to);f.row=to;
    if(!segs.length)return res();
    f.el.style.transition="none";
    let i=0,t0=null,from=f.pos;
    const step=ts=>{
      if(t0===null)t0=ts;
      const [tp,dur]=segs[i],k=Math.min(1,(ts-t0)/(dur*1000));
      f.pos=from+(tp-from)*ease(k);
      f.el.style.transform=tf(f.pos);
      if(k<1)return requestAnimationFrame(step);
      from=tp;t0=null;i++;
      if(i<segs.length)requestAnimationFrame(step);else{f.pos=tp;res();}
    };
    requestAnimationFrame(step);
  });
}
for(const k in films){films[k].pos=films[k].row;}
const goBtn=document.getElementById("go");
let busy=false;
document.getElementById("go").onclick=async()=>{
  if(busy)return;
  const vt=val(W.t),vd=val(W.d);
  if(vt<1||vt>N||vd<1||vd>N)return;
  msg.textContent="";busy=true;goBtn.disabled=true;
  await Promise.all([run(films.t,vt),run(films.d,vd)]);
  busy=false;goBtn.disabled=false;
};
const msg=document.getElementById("msg");
const W={t:{d:[0,0,1],el:document.getElementById("wt"),names:TN},
         d:{d:[0,0,1],el:document.getElementById("wd"),names:DN}};
const val=w=>w.d[0]*100+w.d[1]*10+w.d[2];
function label(w){const v=val(w);return v<1||v>N?"":(w.names[v]||"表示なし");}
function draw(w){
  w.dg.forEach((e,i)=>e.textContent=w.d[i]);
  
}
for(const k in W){
  const w=W[k];w.dg=[];
  const ups=[],dns=[];
  for(let i=0;i<3;i++){
    const u=document.createElement("button");u.setAttribute("aria-label","+");
    u.onclick=()=>{w.d[i]=(w.d[i]+1)%10;draw(w)};ups.push(u);
  }
  for(let i=0;i<3;i++){
    const g=document.createElement("div");g.className="dg";g.tabIndex=0;
    g.addEventListener("keydown",e=>{
      if(/^[0-9]$/.test(e.key)){w.d[i]=+e.key;draw(w);if(g.nextElementSibling&&g.nextElementSibling.classList.contains("dg"))g.nextElementSibling.focus();}
      else if(e.key==="ArrowUp"){e.preventDefault();w.d[i]=(w.d[i]+1)%10;draw(w)}
      else if(e.key==="ArrowDown"){e.preventDefault();w.d[i]=(w.d[i]+9)%10;draw(w)}
      else if(e.key==="Enter"){goBtn.click()}
    });
    w.dg.push(g);
  }
  for(let i=0;i<3;i++){
    const d=document.createElement("button");d.setAttribute("aria-label","-");
    d.onclick=()=>{w.d[i]=(w.d[i]+9)%10;draw(w)};dns.push(d);
  }
  [...ups,...w.dg,...dns].forEach(e=>w.el.appendChild(e));
  draw(w);
}
document.getElementById("save").onclick=async()=>{
  const H=240,pad=24,gap=34,W=pad*2+gap+H*2+H*4,hh=pad*2+H;
  const c=document.createElement("canvas");c.width=W;c.height=hh+120;
  const x=c.getContext("2d");
    x.fillStyle="#D2EF8F";x.fillRect(0,0,W,c.height);
  const fy=60;
  const fg=x.createLinearGradient(0,fy,0,fy+hh);fg.addColorStop(0,"#dff5aa");fg.addColorStop(1,"#b4cf76");
  x.fillStyle="#7f9448";rr(x,0,fy-3,W,hh+6,26);x.fill();
  x.fillStyle=fg;rr(x,3,fy,W-6,hh,24);x.fill();
  const load=s=>new Promise(r=>{if(!s)return r(null);const i=new Image();i.onload=()=>r(i);i.src=s});
  const ti=await load(films.t.imgs[films.t.row]),di=await load(films.d.imgs[films.d.row]);
  const wins=[[pad,H*2,ti],[pad+H*2+gap,H*4,di]];
  for(const [wx,ww,im] of wins){
    x.fillStyle=im?"#1a1a1a":"#FFFDEF";rr(x,wx,fy+pad,ww,H,12);x.fill();
    if(im){x.save();rr(x,wx,fy+pad,ww,H,12);x.clip();x.drawImage(im,wx,fy+pad,ww,H);x.restore();}
  }
  c.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="hosamaku.png";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});
};
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}
</script>
